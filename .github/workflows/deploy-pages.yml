name: Daily Pipeline & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 台灣時間週一至週五 15:40 (UTC 07:40) 每日盤後更新 1 次並寄送摘要通知
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies & Run unit tests
        run: |
          pip install -r pipeline/requirements.txt pytest
          python -m pytest pipeline/tests/ -q

      - name: Run All-Market Data Pipeline (TWSE / TPEx / TDCC / MoneyDJ / FinMind)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python -m pipeline.build.run_pipeline --out web/public/data

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build React + Vite PWA Frontend
        working-directory: web
        env:
          GITHUB_ACTIONS: "true"
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Send Personalized Email Digest (Once Daily on Schedule)
        if: github.event_name == 'schedule'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'hank92312@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || 'hank92312@gmail.com' }}
          SYNC_WORKER_URL: ${{ secrets.SYNC_WORKER_URL || 'https://savestock-sync.hank92312.workers.dev' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'savestock-admin-2026-secret' }}
        run: |
          python -m pipeline.notify.send_digest --data web/public/data

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
